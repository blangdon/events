<style>

  aside button{font:inherit;font-size:22px;font-weight:300;letter-spacing:.08em;text-transform:uppercase;width:100%;
    text-align:left;background:none;border:0;color:var(--dim);padding:7px 6px 6px;cursor:pointer;display:flex;justify-content:space-between;align-items:baseline}
  aside button span{font-size:12.5px;letter-spacing:.04em}
  aside button:hover{color:var(--hi)}
  aside button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
  aside .info{margin-top:18px;color:var(--dim);font-size:12px;line-height:1.55;text-transform:uppercase;letter-spacing:.04em}
  aside .info button{all:unset;color:var(--fg);cursor:pointer;text-decoration:underline;text-underline-offset:3px}

  /* search: just a block cursor */
  .search{position:relative;border:1px solid var(--rule);padding:9px 12px;height:46px;cursor:text;overflow:hidden}
  .search input{position:absolute;inset:0;width:100%;padding:9px 12px;background:none;border:0;outline:none;

  .search .mirror{position:absolute;visibility:hidden;white-space:pre;font-size:20px;letter-spacing:.06em;text-transform:uppercase;left:12px;top:9px}
  .search .cur{position:absolute;top:11px;left:12px;width:.62em;height:24px;background:var(--hi);font-size:20px;animation:blink 1.06s steps(1) infinite;pointer-events:none}

  .search input::-webkit-search-cancel-button{display:none}

  .stats{margin:18px 0 0;border:1px dashed var(--dim);padding:10px 12px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px;font-size:13px}

  .r .w a{color:var(--hi);text-decoration:none;font-size:17px}

  .r .s{text-align:right;white-space:nowrap}
  .r.past{opacity:.3}
  .r.nomatch,.hidepast .r.past{display:none}

  .tg{display:inline-block;font-size:11px;font-weight:500;letter-spacing:.06em;padding:0 5px;margin-right:5px;color:#0a0a0a;line-height:1.5;vertical-align:1px}

  .r .tags{display:block;margin-top:4px}
  .s.free{color:#55ff55}.s.sold{color:#ff5555}.s.tbc{color:#ff55ff}
  .s.soon{background:#fff;color:#0a0a0a;padding:0 5px;justify-self:end}

  .act{display:flex;gap:2px;justify-content:flex-end;align-self:center}
  .act button{background:none;border:0;padding:4px;cursor:pointer;color:#4a4a48;line-height:0}
  .act button svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .act button:hover{color:var(--hi)}
  .act .x{font:inherit;font-size:17px;line-height:17px;width:25px}
  .act .up[aria-pressed="true"]{color:#55ff55}.act .up[aria-pressed="true"] svg{fill:rgba(85,255,85,.25)}
  .act .dn[aria-pressed="true"]{color:#ff5555}.act .dn[aria-pressed="true"] svg{fill:rgba(255,85,85,.25)}
  .act .x:hover{color:#ff5555}
  .r.voted-dn .w a{color:var(--dim)}
  .r.removed{display:none}
  .showdel .r.removed{display:grid;opacity:.35}
  .showdel .r.removed .w a{text-decoration:line-through}
  .none{display:none;margin-top:30px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
  footer{margin-top:40px;color:var(--dim);font-size:12px}

  @media (max-width:820px){
    .app{grid-template-columns:1fr;gap:16px;padding-top:16px}
    aside{position:static}
    aside ul{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--rule)}
    aside li{border:0;border-right:1px solid var(--rule)} aside li:last-child{border-right:0}
    aside button{font-size:15px;justify-content:center;padding:8px 2px} aside button span{display:none}
    aside .info{margin-top:8px}
    .stats{grid-template-columns:1fr 1fr}

    .r .v{grid-column:2;grid-row:2;color:var(--dim);font-size:12.5px}
    .r .s{grid-column:3;grid-row:1}
    .act{grid-column:3;grid-row:2;align-self:end}
    .act button{color:#6a6a68}
    .r .d{font-size:13px}
    .r .w a{font-size:15px}
  }
</style>
</head>

const today=new Date(); today.setHours(0,0,0,0);
const week=new Date(today); week.setDate(week.getDate()+7);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const MON=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
const DAY=["SUN","MON","TUE","WED","THU","FRI","SAT"];
const start=e=>new Date(e.d+"T00:00:00"), end=e=>new Date((e.e||e.d)+"T23:59:59");
const fmt=dt=>DAY[dt.getDay()]+" "+String(dt.getDate()).padStart(2,"0")+" "+MON[dt.getMonth()];
const isTBC=e=>(e.tags||[]).includes("tbc");
function dateCol(e){
  if(isTBC(e)) return e.when.replace(/\s*\(.*\)/,"").split("·")[0].trim().toUpperCase();
  const a=start(e); if(!e.e) return fmt(a);
  return fmt(a)+"\n→ "+fmt(new Date(e.e+"T00:00:00"));
}
function status(e){
  const t=e.tags||[];
  if(end(e)<today) return ["past","ENDED"];
  if(t.includes("sold")) return ["sold","SOLD OUT"];
  if(t.includes("tbc")) return ["tbc","TBC"];
  if(start(e)<=week) return ["soon","THIS WEEK"];
  if(t.includes("free")) return ["free","FREE"];
  return ["ok","ON SALE"];
}
const L={free:"FREE",sold:"SOLD OUT",tbc:"TBC"};

/* ---- prefs: votes + removed. Synced via the artifact db when available, else this browser only ---- */
let PREFS={};
try{PREFS=JSON.parse(localStorage.getItem("whatson-prefs")||"{}")}catch(_){}
let dbCol=null;
const cache=()=>{try{localStorage.setItem("whatson-prefs",JSON.stringify(PREFS))}catch(_){}};
function savePref(e){
  const p=PREFS[e.id]||{};
  cache();
  if(!dbCol) return;
  const doc=dbCol.doc(e.id);
  const empty=!p.vote&&!p.removed;
  (empty?doc.delete():doc.set({vote:p.vote||0,removed:!!p.removed,what:e.what,date:e.d,cat:e.c,at:new Date().toISOString()}))
    .catch(err=>{document.getElementById("sync").textContent="Not saved: "+(err&&err.message||"error")});
}
(async()=>{
  try{
    const db=window.claude&&await claude.use("db"); if(!db) return;
    dbCol=db.collection("prefs");
    const t=setTimeout(()=>{},10000);
    dbCol.onSnapshot(snap=>{
      clearTimeout(t);
      const next={};
      (snap.docs||snap).forEach(d=>{const v=d.data?d.data():d; next[d.id]={vote:v.vote||0,removed:!!v.removed}});
      PREFS=next; cache(); renderBoards();
      document.getElementById("sync").textContent="Votes sync across devices";
    },()=>clearTimeout(t));
  }catch(_){}
})();

function renderBoards(){
["family","adult","away"].forEach(cat=>{
  const list=EVENTS.filter(e=>e.c===cat).sort((a,b)=>a.d.localeCompare(b.d));
  document.getElementById(cat).innerHTML=list.map(e=>{
    const [cls,label]=status(e);
    const p=PREFS[e.id]||{};
    const tl=(e.tags||[]).filter(t=>L[t]).map(t=>`<span class="tg ${t}">${L[t]}</span>`);
    if(cls==="soon") tl.unshift(`<span class="tg soon">THIS WEEK</span>`);
    const rc=["r",cls==="past"?"past":"",p.removed?"removed":"",p.vote<0?"voted-dn":""].filter(Boolean).join(" ");
    return `<div class="${rc}" data-i="${EVENTS.indexOf(e)}">
      <div class="d">${esc(dateCol(e))}<span class="tm">${esc(e.t||"Time TBC")}</span></div>
      <div class="w"><a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.what)}</a>${e.note?`<span class="n">${esc(e.note)}</span>`:""}${tl.length&&cls!=="past"?`<span class="tags">${tl.join("")}</span>`:""}</div>
      <div class="v">${esc(e.where)}</div>
      <div class="s ${cls}">${label}</div>
      <div class="act">
        <button class="up" data-a="up" aria-pressed="${p.vote>0}" title="More like this">${ICON_UP}</button>
        <button class="dn" data-a="dn" aria-pressed="${p.vote<0}" title="Less like this">${ICON_DN}</button>
        <button class="x" data-a="x" title="${p.removed?"Restore":"Remove from list"}">${p.removed?"↺":"✕"}</button>
      </div></div>`;
  }).join("");
});
const live=EVENTS.filter(e=>!(PREFS[e.id]||{}).removed);
const up=live.filter(e=>end(e)>=today);
const local=up.filter(e=>e.c!=="away").sort((a,b)=>a.d.localeCompare(b.d));
const next=local[0];
document.getElementById("stats").innerHTML=`
  <div><span>Upcoming</span><b>${up.length}</b></div>
  <div><span>Next 7 days</span><b>${local.filter(e=>start(e)<=week).length}</b></div>
  <div><span>Free events</span><b>${up.filter(e=>(e.tags||[]).includes("free")).length}</b></div>
  <div><span>Next up</span><b>${next?`<a href="${esc(next.url)}" target="_blank" rel="noopener">${esc(next.what.toUpperCase())}</a>`:"—"}</b></div>`;
["family","adult","away"].forEach(c=>document.getElementById("n-"+c).textContent=up.filter(e=>e.c===c).length);
document.getElementById("n-all").textContent=up.length;
const nDel=EVENTS.length-live.length, sd=document.getElementById("showdel");
sd.hidden=!nDel; sd.textContent=(document.body.classList.contains("showdel")?"Hide":"Show")+" removed ("+nDel+")";
if(typeof runSearch==="function") runSearch();
}

document.addEventListener("click",ev=>{
  const btn=ev.target.closest(".act button"); if(!btn) return;
  const e=EVENTS[+btn.closest(".r").dataset.i];
  const p=PREFS[e.id]={...(PREFS[e.id]||{})};
  const a=btn.dataset.a;
  if(a==="up") p.vote=p.vote>0?0:1;
  if(a==="dn") p.vote=p.vote<0?0:-1;
  if(a==="x") p.removed=!p.removed;
  savePref(e); renderBoards();
});
document.getElementById("showdel").onclick=()=>{document.body.classList.toggle("showdel");renderBoards()};

/* filters */
let filter="all";
function setFilter(f){
  filter=f;
  document.querySelectorAll("aside button[data-f]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.f===f)));
  document.querySelectorAll("section").forEach(s=>s.classList.toggle("hidden",f!=="all"&&s.dataset.sec!==f));
  runSearch();
}
document.querySelectorAll("aside button[data-f]").forEach(b=>b.onclick=()=>{setFilter(b.dataset.f);qEl.focus()});
const pb=document.getElementById("past");
pb.onclick=()=>{const on=document.body.classList.toggle("hidepast");pb.textContent=on?"Show past events":"Hide past events";runSearch();};

/* fuzzy search */
const MONTHS=["january","february","march","april","may","june","july","august","september","october","november","december"];
const DAYS=["sunday","monday","tuesday","wednesday","thursday","friday","saturday"];
const norm=t=>t.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9: ]+/g," ");
const HAY=EVENTS.map(e=>{
  const dt=start(e);
  const kw=/crusaders|super rugby|rugby world/i.test(e.what)?"rugby sport":/blackcaps/i.test(e.what)?"cricket sport":/supercars/i.test(e.what)?"motorsport cars racing sport":/america/i.test(e.what)?"sailing yachting sport":/world cup/i.test(e.what)?"football soccer sport":/parade|christmas|nye|sparks/i.test(e.what)?"christmas festive":"";
  const cat={family:"family kids all ages",adult:"adults night out",away:"beyond away overseas trip"}[e.c];
  const text=norm([kw,e.what,e.where,e.note,e.when,e.t||"",(e.tags||[]).join(" "),(e.tags||[]).includes("sold")?"sold out":"",MONTHS[dt.getMonth()],DAYS[dt.getDay()],cat].join(" "));
  return {text,words:text.split(/\s+/).filter(Boolean)};
});
function osa(a,b){const m=a.length,n=b.length,d=[];for(let i=0;i<=m;i++)d[i]=[i];for(let j=0;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){const c=a[i-1]===b[j-1]?0:1;d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+c);
  if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1)}return d[m][n]}
function subseq(q,w){let i=0;for(const c of w){if(c===q[i])i++;if(i===q.length)return true}return false}
function tokenHits(tok,h){
  if(h.text.includes(tok)) return true;
  const max=tok.length>=7?2:tok.length>=4?1:0;
  return h.words.some(w=>(tok.length>=3&&w[0]===tok[0]&&subseq(tok,w)&&w.length<=tok.length*2)||(max&&(osa(tok,w)<=max||osa(tok,w.slice(0,tok.length))<=max)));
}
const qEl=document.getElementById("q"),mirror=document.getElementById("mirror"),cur=document.getElementById("cur");
function placeCursor(){
  mirror.textContent=qEl.value;
  const w=mirror.getBoundingClientRect().width, box=qEl.clientWidth-24;
  cur.style.left=(12+Math.min(w,box))+"px";
  cur.style.animation="none"; void cur.offsetWidth; cur.style.animation="";
}
function runSearch(){
  const toks=norm(qEl.value).split(/\s+/).filter(Boolean);
  let shown=0;
  document.querySelectorAll(".r[data-i]").forEach(r=>r.classList.toggle("nomatch",toks.length>0&&!toks.every(t=>tokenHits(t,HAY[+r.dataset.i]))));
  document.querySelectorAll("section").forEach(sec=>{
    const vis=[...sec.querySelectorAll(".r[data-i]")].filter(r=>!r.classList.contains("nomatch")&&!(r.classList.contains("removed")&&!document.body.classList.contains("showdel"))&&!(document.body.classList.contains("hidepast")&&r.classList.contains("past"))).length;
    sec.classList.toggle("empty",toks.length>0&&vis===0);
    if(filter==="all"||sec.dataset.sec===filter) shown+=vis;
  });
  document.getElementById("none").style.display=toks.length&&!shown?"block":"none";
}
qEl.addEventListener("input",()=>{placeCursor();runSearch()});
document.getElementById("sbox").addEventListener("click",()=>qEl.focus());
document.addEventListener("keydown",e=>{
  if(document.activeElement===qEl){ if(e.key==="Escape"){qEl.value="";placeCursor();runSearch()} return; }
  if(e.key.length===1&&!e.metaKey&&!e.ctrlKey&&!e.altKey){qEl.focus()}
  if(e.key==="Backspace"){qEl.focus()}
});
renderBoards();
document.fonts&&document.fonts.ready.then(placeCursor); placeCursor();
</script>
</body>
</html>
