<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try{var t=localStorage.getItem("whatson-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}</script>
<title>WHATSON.EXE - Christchurch & Canterbury</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0a0a;--fg:#e8e8e6;--dim:#8a8a87;--rule:#5a5a58;--hi:#ffffff;
    --faint:#6a6a67;--faint2:#5f5f5c;--icon:#4a4a48;--hover:#151515;--red:#ff5555;--green:#55ff55;
    --soon-bg:#ffffff;--soon-fg:#0a0a0a;--mark:#ffff55;color-scheme:dark}
  :root[data-theme="light"]{--bg:#f5f4f0;--fg:#1c1c1b;--dim:#6b6a66;--rule:#c4c3be;--hi:#000000;
    --faint:#85847f;--faint2:#94938e;--icon:#aeada8;--hover:#e8e7e2;--red:#d42f2f;--green:#178a40;
    --soon-bg:#111111;--soon-fg:#ffffff;--mark:#ffe94d;color-scheme:light}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:15px;line-height:1.35;-webkit-font-smoothing:antialiased}
  .app{max-width:1520px;margin:0 auto;padding:28px 24px 50px;display:grid;grid-template-columns:180px minmax(0,1fr);gap:96px}

  /* sidebar */
  aside{position:sticky;top:28px;align-self:start;margin-top:var(--list-top,76px)}
  aside ul{list-style:none;margin:0;padding:0}
  aside li{margin:0}
  aside button{font:inherit;font-size:15px;font-weight:300;letter-spacing:.08em;text-transform:uppercase;width:100%;
    text-align:left;background:none;border:0;color:var(--dim);padding:5px 8px;cursor:pointer;display:flex;justify-content:space-between;align-items:baseline}
  aside button span{font-size:11.5px;letter-spacing:.04em}
  aside button:hover{color:var(--hi)}
  aside button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
  aside .more{all:unset;display:block;margin:16px 8px 0;color:var(--dim);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
  aside .more:hover{color:var(--hi)}
  aside .more[hidden]{display:none}
  .syncmsg{margin:6px 8px 0;font-size:10.5px;color:var(--dim);letter-spacing:.04em;text-transform:uppercase}
  .syncmsg:empty{display:none}
  .upd{margin:18px 8px 0;display:flex;flex-direction:column;gap:4px;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
  .upd button{all:unset;cursor:pointer;color:var(--dim);align-self:flex-start}
  .upd button:hover{color:var(--hi)}
  .upd button[disabled]{cursor:default;color:var(--faint)}
  .upd button.spin::first-letter{display:inline-block}
  .upd #syncmsg{color:var(--fg);transition:opacity .4s}
  .upd #syncmsg.ok{color:var(--green)}.upd #syncmsg.err{color:var(--red)}
  .upd #syncmsg.fade{opacity:0}
  .favs{margin-top:28px}
  .favs[hidden]{display:none}
  .favs h3{margin:0 8px 6px;font-size:11.5px;font-weight:500;letter-spacing:.08em;color:var(--red);text-transform:uppercase}
  .favs ol{list-style:none;margin:0;padding:0;max-height:calc(100vh - 300px);overflow:auto}
  .fv>button{all:unset;display:block;box-sizing:border-box;width:100%;padding:4px 8px;cursor:pointer;text-transform:uppercase;letter-spacing:.04em}
  .fv>button:hover{background:var(--hover)}
  .fv .fd{display:block;color:var(--dim);font-size:10.5px}
  .fv .fn{display:block;font-size:12.5px;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fv.exp .fn{white-space:normal}
  .fv .fx{display:none;padding:2px 8px 10px;font-size:11.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;line-height:1.55}
  .fv.exp .fx{display:block}
  .fv .fx a{color:var(--hi);text-decoration:underline;text-underline-offset:3px}
  .fv .fx .unfav{all:unset;cursor:pointer;color:var(--red);margin-left:10px}

  /* search: just a block cursor */
  .search{position:relative;padding:9px 0;height:46px;cursor:text;overflow:hidden}
  .search input{position:absolute;inset:0;width:100%;padding:9px 0;background:none;border:0;outline:none;
    color:var(--hi);font:inherit;font-size:20px;letter-spacing:.06em;text-transform:uppercase;caret-color:transparent}
  .search .mirror{position:absolute;visibility:hidden;white-space:pre;font-size:20px;letter-spacing:.06em;text-transform:uppercase;left:0;top:9px}
  .search .cur{display:none;position:absolute;top:11px;left:0;width:.62em;height:24px;background:var(--hi);font-size:20px;animation:blink 1.06s steps(1) infinite;pointer-events:none}
  @keyframes blink{50%{opacity:0}}
  .search input::-webkit-search-cancel-button{display:none}
  .search:focus-within .cur{display:block}
  .search input::placeholder{color:var(--faint2);text-transform:none;letter-spacing:.04em;opacity:1}
  .search:focus-within input::placeholder{color:transparent}


  section{margin-top:30px}
  section.hidden,section.empty{display:none}
  h2{font-weight:500;font-size:20px;letter-spacing:.06em;margin:0 0 8px;text-transform:uppercase}

  .board{border-top:1px solid var(--rule)}
  .r{display:grid;grid-template-columns:190px 96px minmax(0,1.5fr) minmax(0,1fr) 100px 64px;gap:18px;align-items:baseline;
    padding:7px 4px 6px;border-bottom:1px solid var(--rule);text-transform:uppercase;letter-spacing:.06em}
  .r .d{font-variant-numeric:tabular-nums;line-height:1.3}
  .r .ago{color:var(--fg);font-variant-numeric:tabular-nums;white-space:nowrap}
  .r .d .tm{display:block;color:var(--dim);font-size:12.5px;letter-spacing:.04em;margin-top:2px}
  .r .w a,.r .w .ttl.plain{color:var(--hi);text-decoration:none;font-size:17px}
  .r .w a:hover{text-decoration:underline;text-underline-offset:4px}
  .r .w .n{display:block;text-transform:none;letter-spacing:0;color:var(--dim);font-size:12.5px;margin-top:2px}
  .r .s{display:flex;flex-direction:column;align-items:flex-end;gap:4px;white-space:nowrap}
  .r .s .onsale{color:var(--dim)}
  .r.past{opacity:.3}
  .r.nomatch,.r.past{display:none}

  .tg{display:inline-block;font-size:12px;font-weight:500;letter-spacing:.06em;padding:1px 6px;color:#0a0a0a;line-height:1.5;vertical-align:1px}
  .tg.free{background:#55ff55}.tg.sold{background:#ff5555}.tg.tbc{background:#ff55ff}.tg.soon{background:var(--soon-bg);color:var(--soon-fg)}
  mark{background:var(--mark);color:#0a0a0a;padding:0 1px}
  .r .kw mark{background:var(--mark);color:#0a0a0a}
  .r .kw .hk{all:unset;cursor:pointer}
  .r .kw .hk:hover{color:var(--hi)}
  .r .kw{display:block;margin-top:4px;text-transform:none;letter-spacing:.02em;color:var(--faint2);font-size:11.5px}

  .act{display:flex;gap:2px;justify-content:flex-end;align-self:center}
  .act button{visibility:hidden;opacity:0;transition:opacity .12s}
  @media (hover:hover){ .r:hover .act button{visibility:visible;opacity:1} }
  .r.open .act button,.act .fav[aria-pressed="true"]{visibility:visible;opacity:1}
  .act .fav[aria-pressed="true"]{color:var(--red)}.act .fav[aria-pressed="true"] svg{fill:var(--red)}
  .act button{background:none;border:0;padding:4px;cursor:pointer;color:var(--icon);line-height:0}
  .act button svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .act button:hover{color:var(--hi)}
  .act .x{font:inherit;font-size:17px;line-height:17px;width:25px}
  .act .x:hover{color:var(--red)}
  .r.removed{display:none}
  .showdel .r.removed:not(.past){display:grid;opacity:.35}
  .showdel .r.removed .w a{text-decoration:line-through}
  .none{display:none;margin-top:30px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
  footer{margin-top:40px;color:var(--dim);font-size:12px}

  @media (max-width:820px){
    .app{grid-template-columns:1fr;gap:16px;padding-top:16px}
    /* every sidebar item has 8px inner padding; pull the column left so its text lines up with the list */
    aside{position:static;margin-top:0;margin-left:-8px}
    aside ul{display:flex;flex-wrap:wrap;gap:6px}
    aside li{flex:0 0 auto}
    aside button{font-size:14px;justify-content:flex-start;padding:7px 8px;width:auto} aside button span{display:none}
    aside .more{margin:8px 8px 0}
    .r{padding-left:0;padding-right:0}
      .r{grid-template-columns:96px minmax(0,1fr) auto;gap:4px 10px}
    .r .d{grid-column:1;grid-row:1}
    .r .ago{grid-column:1;grid-row:2;font-size:12.5px;color:var(--dim)}
    .r .w{grid-column:2;grid-row:1}
    .r .v{grid-column:2;grid-row:2;color:var(--dim);font-size:12.5px}
    .r .s{grid-column:3;grid-row:1}
    .act{grid-column:3;grid-row:2;align-self:end}
    .act button{color:var(--faint)}
    .r .d{font-size:13px}
    .r .w a,.r .w .ttl.plain{font-size:15px}
  }
</style>
</head>
<body>
<div class="app">

<aside>
  <ul role="group" aria-label="Filter">
    <li><button data-f="all" aria-pressed="true">All<span id="n-all"></span></button></li>
    <li><button data-f="family" aria-pressed="false">Family<span id="n-family"></span></button></li>
    <li><button data-f="adult" aria-pressed="false">Adults<span id="n-adult"></span></button></li>
  </ul>
  <div class="upd"><span id="updtxt">Loading…</span><button id="refresh" title="Check for updates">↻ Refresh</button><button id="theme" title="Switch light / dark"></button><span id="syncmsg" aria-live="polite"></span></div>
  <button class="more" id="showdel" hidden></button>
  <div class="favs" id="favs" hidden><h3>♥ Favourites</h3><ol id="favlist"></ol></div>
</aside>

<main>
  <div class="search" id="sbox">
    <input id="q" type="text" aria-label="Filter events" autocomplete="off" spellcheck="false" placeholder="Search ...">
    <span class="mirror" id="mirror"></span>
    <span class="cur" id="cur"></span>
  </div>


  <section data-sec="family"><h2>Family &amp; Kids</h2><div class="board" id="family"></div></section>
  <section data-sec="adult"><h2>Adults</h2><div class="board" id="adult"></div></section>
  <p class="none" id="none">No matches</p>

  <footer>Every event name links to its listing or ticket page.</footer>
</main>
</div>

<script>
let EVENTS=[];          /* loaded from events.json (and JSONBin on Netlify) */
let DATA_UPDATED=null;

const today=new Date(); today.setHours(0,0,0,0);
const week=new Date(today); week.setDate(week.getDate()+7);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const MON=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
const DAY=["SUN","MON","TUE","WED","THU","FRI","SAT"];
const start=e=>new Date(e.d+"T00:00:00"), end=e=>new Date((e.e||e.d)+"T23:59:59");
const fmt=dt=>DAY[dt.getDay()]+" "+dt.getDate()+" "+MON[dt.getMonth()];
const isTBC=e=>(e.tags||[]).includes("tbc");
function dateCol(e){
  if(isTBC(e)) return e.when.replace(/\s*\(.*\)/,"").split("·")[0].trim().toUpperCase();
  const a=start(e); if(!e.e) return fmt(a);
  const b=new Date(e.e+"T00:00:00"), dd=x=>x.getDate();
  return a.getMonth()===b.getMonth()
    ? DAY[a.getDay()]+" "+dd(a)+"–"+dd(b)+" "+MON[b.getMonth()]
    : fmt(a)+" – "+dd(b)+" "+MON[b.getMonth()];
}
function status(e){
  const t=e.tags||[];
  if(end(e)<today) return ["past","ENDED"];
  if(t.includes("sold")) return ["sold","SOLD OUT"];
  if(t.includes("tbc")) return ["tbc","TBC"];
  if(start(e)>=today&&start(e)<=week) return ["soon","THIS WEEK"];
  if(t.includes("free")) return ["free","FREE"];
  return ["ok","ON SALE"];
}
const L={free:"FREE",sold:"SOLD OUT",tbc:"TBC"};
function away(e){
  if(isTBC(e)) return "TBC";
  const n=Math.round((start(e)-today)/864e5);
  if(n<=0) return end(e)>=today&&n<0?"ON NOW":"TODAY";
  if(n===1) return "TOMORROW";
  return n+" DAYS";
}

const idOf=e=>(e.what+"-"+e.d).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,80);
function prepEvents(){EVENTS.forEach(e=>e.id=e.id||idOf(e));}
prepEvents();
const ICON_HEART='<svg viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>';

const isFav=e=>{const p=PREFS[e.id]; return p&&typeof p.fav==="boolean"?p.fav:!!e.fav;};
/* ---- prefs: hearts + removed. Synced via the artifact db when available, else this browser only ---- */
let PREFS={};
try{PREFS=JSON.parse(localStorage.getItem("whatson-prefs")||"{}")}catch(_){}
let dbCol=null;
const cache=()=>{try{localStorage.setItem("whatson-prefs",JSON.stringify(PREFS))}catch(_){}};
function savePref(e){
  const p=PREFS[e.id]||{};
  cache();
  binSavePrefs();
  if(!dbCol) return;
  const doc=dbCol.doc(e.id);
  const empty=!p.removed&&(typeof p.fav!=="boolean"||p.fav===!!e.fav);
  (empty?doc.delete():doc.set({removed:!!p.removed,fav:isFav(e),what:e.what,date:e.d,cat:e.c,at:new Date().toISOString()}))
    .catch(()=>{});
}
/* ---- JSONBin sync via the site's /api/bin Netlify function (key lives in Netlify, not here).
   Shares hearts/likes/removals across devices and lets the event list be edited at jsonbin.io.
   Skipped on the Claude-hosted page, which has no /api. ---- */
const BIN_ON=!/claude/i.test(location.hostname)&&/^https?:$/.test(location.protocol);
let binOK=false;
const strip=evs=>evs.map(e=>({id:e.id,...e}));  // keep ids so renaming an event keeps its hearts/likes
const setSync=t=>{const el=document.getElementById("syncmsg"); if(el) el.textContent=t};
async function binGet(){const r=await fetch("/api/bin",{cache:"no-store"}); if(r.status===503||r.status===404) return null; if(!r.ok) throw new Error("HTTP "+r.status); return (await r.json())||{};}
async function binPut(rec){const r=await fetch("/api/bin",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(rec)}); if(!r.ok) throw new Error("HTTP "+r.status);}
async function fetchFile(){
  const r=await fetch("events.json?t="+Date.now(),{cache:"no-store"});
  if(!r.ok) throw new Error("events.json HTTP "+r.status);
  return r.json();
}
function useEvents(list,updated){EVENTS=list; prepEvents(); buildHay(); DATA_UPDATED=updated||null;}
async function loadData(){
  const file=await fetchFile();
  let chosen={events:file.events,updated:file.updated};
  if(BIN_ON){
    try{
      const rec=await binGet();
      if(rec!==null){
        binOK=true;
        const hasEvents=Array.isArray(rec.events)&&rec.events.length;
        const binWins=hasEvents&&new Date(rec.updated||0)>=new Date(file.updated||0);
        if(binWins) chosen={events:rec.events,updated:rec.updated};
        if(rec.prefs&&Object.keys(rec.prefs).length) PREFS=rec.prefs; cache();
        if(!binWins) await binPut({updated:file.updated,events:file.events,prefs:PREFS});
        else if(JSON.stringify(rec.prefs||{})!==JSON.stringify(PREFS)) await binPut({...rec,prefs:PREFS});
      }
    }catch(err){ /* bin is optional; carry on with events.json */ }
  }
  useEvents(chosen.events,chosen.updated);
}
let binTimer=null;
function binSavePrefs(){
  if(!binOK) return;
  clearTimeout(binTimer);
  binTimer=setTimeout(async()=>{
    try{const rec=(await binGet())||{}; rec.prefs=PREFS; if(!Array.isArray(rec.events)){rec.events=strip(EVENTS);rec.updated=DATA_UPDATED} await binPut(rec); setSync("");}
    catch(err){setSync("Sync failed ("+err.message+")")}
  },700);
}

(async()=>{
  try{
    const db=window.claude&&await claude.use("db"); if(!db) return;
    dbCol=db.collection("prefs");
    const t=setTimeout(()=>{},10000);
    dbCol.onSnapshot(snap=>{
      clearTimeout(t);
      const next={};
      (snap.docs||snap).forEach(d=>{const v=d.data?d.data():d; next[d.id]={removed:!!v.removed,...(typeof v.fav==="boolean"?{fav:v.fav}:{})}});
      PREFS=next; cache(); renderBoards();
      
    },()=>clearTimeout(t));
  }catch(_){}
})();

function renderBoards(){
["family","adult"].forEach(cat=>{
  const list=EVENTS.filter(e=>e.c===cat).sort((a,b)=>a.d.localeCompare(b.d));
  document.getElementById(cat).innerHTML=list.map(e=>{
    const [cls,label]=status(e);
    const p=PREFS[e.id]||{};
    const order=["sold","free"];
    const tl=order.filter(t=>(e.tags||[]).includes(t)).map(t=>`<span class="tg ${t}">${L[t]}</span>`);
    if(cls==="soon") tl.unshift(`<span class="tg soon">THIS WEEK</span>`);
    const rc=["r",cls==="past"?"past":"",p.removed?"removed":""].filter(Boolean).join(" ");
    return `<div class="${rc}" data-i="${EVENTS.indexOf(e)}">
      <div class="d">${esc(dateCol(e))}<span class="tm">${esc(e.t||"Time TBC")}</span></div>
      <div class="ago">${away(e)}</div>
      <div class="w">${e.url?`<a href="${esc(e.url)}" target="_blank" rel="noopener" class="ttl" data-raw="${esc(e.what)}">${esc(e.what)}</a>`:`<span class="ttl plain" data-raw="${esc(e.what)}">${esc(e.what)}</span>`}${e.note?`<span class="n">${esc(e.note)}</span>`:""}${(e.k||[]).length?`<span class="kw">${e.k.map(x=>`<button class="hk" data-k="${esc(x)}">#${esc(x)}</button>`).join(" ")}</span>`:""}</div>
      <div class="v">${esc(e.where||"—")}</div>
      <div class="s">${tl.length?tl.join(""):(isTBC(e)||!e.url)?"":`<span class="onsale">ON SALE</span>`}</div>
      <div class="act">
        <button class="fav" data-a="fav" aria-pressed="${isFav(e)}" title="${isFav(e)?"Unfavourite":"Favourite"}">${ICON_HEART}</button>
        <button class="x" data-a="x" title="${p.removed?"Restore":"Remove from list"}">${p.removed?"↺":"✕"}</button>
      </div></div>`;
  }).join("");
});
const live=EVENTS.filter(e=>!(PREFS[e.id]||{}).removed);
const up=live.filter(e=>end(e)>=today);
["family","adult"].forEach(c=>document.getElementById("n-"+c).textContent=up.filter(e=>e.c===c).length);
document.getElementById("n-all").textContent=up.length;
const nDel=EVENTS.length-live.length, sd=document.getElementById("showdel");
sd.hidden=!nDel; sd.textContent=(document.body.classList.contains("showdel")?"Hide":"Show")+" removed ("+nDel+")";
renderFavs();
if(typeof runSearch==="function") runSearch();
}
const openFavs=new Set();
function renderFavs(){
  const favs=EVENTS.filter(e=>isFav(e)&&!(PREFS[e.id]||{}).removed&&end(e)>=today).sort((a,b)=>a.d.localeCompare(b.d));
  const box=document.getElementById("favs"); box.hidden=!favs.length;
  document.getElementById("favlist").innerHTML=favs.map(e=>`<li class="fv${openFavs.has(e.id)?" exp":""}" data-id="${e.id}">
    <button aria-expanded="${openFavs.has(e.id)}"><span class="fd">${esc(dateCol(e))} · ${away(e)}</span><span class="fn">${esc(e.what)}</span></button>
    <div class="fx">${esc(e.t||"Time TBC")}${e.where?"<br>"+esc(e.where):""}<br>${e.url?`<a href="${esc(e.url)}" target="_blank" rel="noopener">Details ↗</a>`:""}<button class="unfav" data-id="${e.id}">♥ Remove</button></div></li>`).join("");
}
document.getElementById("favlist").addEventListener("click",ev=>{
  const un=ev.target.closest(".unfav");
  if(un){const e=EVENTS.find(x=>x.id===un.dataset.id); PREFS[e.id]={...(PREFS[e.id]||{}),fav:false}; openFavs.delete(e.id); savePref(e); renderBoards(); return;}
  const li=ev.target.closest(".fv"); if(!li||ev.target.closest("a")) return;
  const id=li.dataset.id; openFavs.has(id)?openFavs.delete(id):openFavs.add(id); renderFavs();
});

document.addEventListener("click",ev=>{
  const hk=ev.target.closest(".hk");
  if(hk){qEl.value=hk.dataset.k.replace(/-/g," ");placeCursor();runSearch();qEl.focus();window.scrollTo({top:0,behavior:"smooth"});return;}
  const btn=ev.target.closest(".act button");
  if(!btn){
    const row=ev.target.closest(".r[data-i]");
    if(row&&!ev.target.closest("a")&&!matchMedia("(hover:hover)").matches){
      const was=row.classList.contains("open");
      document.querySelectorAll(".r.open").forEach(r=>r.classList.remove("open"));
      if(!was) row.classList.add("open");
    }
    return;
  }
  const e=EVENTS[+btn.closest(".r").dataset.i];
  const p=PREFS[e.id]={...(PREFS[e.id]||{})};
  const a=btn.dataset.a;
  if(a==="fav") p.fav=!isFav(e);
  if(a==="x") p.removed=!p.removed;
  savePref(e); renderBoards();
  const again=document.querySelector(`.r[data-i="${EVENTS.indexOf(e)}"]`); if(again&&!matchMedia("(hover:hover)").matches) again.classList.add("open");
});
document.getElementById("showdel").onclick=()=>{document.body.classList.toggle("showdel");renderBoards()};

/* filters */
let filter="all";
function setFilter(f){
  filter=f;
  document.querySelectorAll("aside button[data-f]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.f===f)));
  document.querySelectorAll("section").forEach(s=>s.classList.toggle("hidden",f!=="all"&&s.dataset.sec!==f));
  runSearch();
}
document.querySelectorAll("aside button[data-f]").forEach(b=>b.onclick=()=>{setFilter(b.dataset.f);qEl.focus()});

/* fuzzy search */
const MONTHS=["january","february","march","april","may","june","july","august","september","october","november","december"];
const DAYS=["sunday","monday","tuesday","wednesday","thursday","friday","saturday"];
const norm=t=>t.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9: ]+/g," ");
let HAY=[];
function buildHay(){HAY=EVENTS.map(e=>{
  const dt=start(e);
  const kw=(e.k||[]).map(x=>x+" "+x.replace(/-/g," ")).join(" ");
  const cat={family:"family kids all ages",adult:"adults night out"}[e.c];
  const text=norm([kw,e.what,e.where,e.note,e.when,e.t||"",(e.tags||[]).join(" "),(e.tags||[]).includes("sold")?"sold out":"",MONTHS[dt.getMonth()],DAYS[dt.getDay()],cat].join(" "));
  return {text,words:text.split(/\s+/).filter(Boolean)};
});}
buildHay();
function osa(a,b){const m=a.length,n=b.length,d=[];for(let i=0;i<=m;i++)d[i]=[i];for(let j=0;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){const c=a[i-1]===b[j-1]?0:1;d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+c);
  if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1)}return d[m][n]}
function subseq(q,w){let i=0;for(const c of w){if(c===q[i])i++;if(i===q.length)return true}return false}
function tokenHits(tok,h){
  if(h.text.includes(tok)) return true;
  const max=tok.length>=7?2:tok.length>=4?1:0;
  return h.words.some(w=>(tok.length>=3&&w[0]===tok[0]&&subseq(tok,w)&&w.length<=tok.length*2)||(max&&(tok.length>5||w[0]===tok[0])&&(osa(tok,w)<=max||osa(tok,w.slice(0,tok.length))<=max)));
}
const qEl=document.getElementById("q"),mirror=document.getElementById("mirror"),cur=document.getElementById("cur");
function placeCursor(){
  mirror.textContent=qEl.value;
  const w=mirror.getBoundingClientRect().width, box=qEl.clientWidth-14;
  cur.style.left=Math.min(w,box)+"px";
  cur.style.animation="none"; void cur.offsetWidth; cur.style.animation="";
}
function wordHit(tok,w){
  if(w.includes(tok)) return "sub";
  const max=tok.length>=7?2:tok.length>=4?1:0;
  if(tok.length>=3&&w[0]===tok[0]&&subseq(tok,w)&&w.length<=tok.length*2) return "word";
  if(max&&(tok.length>5||w[0]===tok[0])&&(osa(tok,w)<=max||osa(tok,w.slice(0,tok.length))<=max)) return "word";
  return "";
}
function highlight(raw,toks){
  if(!toks.length) return esc(raw);
  const ranges=[], re=/[A-Za-zÀ-ÿĀ-ž0-9']+/g; let m;
  while((m=re.exec(raw))){
    const w=norm(m[0]).replace(/\s+/g,"");
    for(const t of toks){
      const h=wordHit(t,w); if(!h) continue;
      if(h==="sub"){const i=w.indexOf(t); ranges.push([m.index+i,m.index+i+t.length]);}
      else ranges.push([m.index,m.index+m[0].length]);
    }
  }
  if(!ranges.length) return esc(raw);
  ranges.sort((a,b)=>a[0]-b[0]);
  const merged=[ranges[0].slice()];
  for(const r of ranges.slice(1)){const l=merged[merged.length-1]; if(r[0]<=l[1]) l[1]=Math.max(l[1],r[1]); else merged.push(r.slice());}
  let out="",pos=0;
  for(const [a,b] of merged){out+=esc(raw.slice(pos,a))+"<mark>"+esc(raw.slice(a,b))+"</mark>";pos=b;}
  return out+esc(raw.slice(pos));
}
function runSearch(){
  const toks=norm(qEl.value).split(/\s+/).filter(Boolean);
  let shown=0;
  document.querySelectorAll(".r[data-i]").forEach(r=>{
    const ok=!toks.length||toks.every(t=>tokenHits(t,HAY[+r.dataset.i]));
    r.classList.toggle("nomatch",!ok);
    const a=r.querySelector(".ttl"); a.innerHTML=ok?highlight(a.dataset.raw,toks):esc(a.dataset.raw);
    r.querySelectorAll(".hk").forEach(b=>{const raw="#"+b.dataset.k; b.innerHTML=ok&&toks.length?"#"+highlight(b.dataset.k,toks):esc(raw);});
  });
  document.querySelectorAll("section").forEach(sec=>{
    const vis=[...sec.querySelectorAll(".r[data-i]")].filter(r=>!r.classList.contains("nomatch")&&!(r.classList.contains("removed")&&!document.body.classList.contains("showdel"))&&!r.classList.contains("past")).length;
    sec.classList.toggle("empty",toks.length>0&&vis===0);
    if(filter==="all"||sec.dataset.sec===filter) shown+=vis;
  });
  document.getElementById("none").style.display=toks.length&&!shown?"block":"none";
}
qEl.addEventListener("input",()=>{placeCursor();runSearch()});
document.getElementById("sbox").addEventListener("click",()=>qEl.focus());
document.addEventListener("keydown",e=>{
  const ae=document.activeElement;
  if(ae&&ae!==qEl&&/INPUT|TEXTAREA/.test(ae.tagName)) return;
  if(document.activeElement===qEl){ if(e.key==="Escape"){qEl.value="";placeCursor();runSearch()} return; }
  if(e.key.length===1&&!e.metaKey&&!e.ctrlKey&&!e.altKey){qEl.focus()}
  if(e.key==="Backspace"){qEl.focus()}
});
renderBoards();
document.fonts&&document.fonts.ready.then(placeCursor); placeCursor();

const fmtUpd=iso=>{if(!iso) return "";const d=new Date(iso);return "Updated "+d.getDate()+" "+MON[d.getMonth()]+", "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");};
let msgTimer=null;
function flash(text,kind){
  const el=document.getElementById("syncmsg"); clearTimeout(msgTimer);
  el.className=kind||""; el.textContent=text;
  if(kind==="ok"||kind==="info") msgTimer=setTimeout(()=>{el.classList.add("fade");setTimeout(()=>{el.textContent="";el.className=""},450)},4000);
}
async function refresh(manual){
  const btn=document.getElementById("refresh"), before=new Map(EVENTS.map(e=>[e.id,JSON.stringify(e)]));
  if(manual){btn.disabled=true; btn.textContent="↻ Checking…"; flash("");}
  try{
    await Promise.all([loadData(), manual?new Promise(r=>setTimeout(r,500)):null]);  // keep "Checking…" visible briefly
    renderBoards(); alignSidebar();
    document.getElementById("updtxt").textContent=fmtUpd(DATA_UPDATED);
    if(manual){
      const added=EVENTS.filter(e=>!before.has(e.id)).length;
      const changed=EVENTS.filter(e=>before.has(e.id)&&before.get(e.id)!==JSON.stringify(e)).length;
      const gone=[...before.keys()].filter(id=>!EVENTS.some(e=>e.id===id)).length;
      const parts=[added&&added+" new",changed&&changed+" changed",gone&&gone+" removed"].filter(Boolean);
      flash(parts.length?"✓ "+parts.join(" · "):"✓ Up to date","ok");
    }
  }catch(err){
    if(!EVENTS.length) document.getElementById("updtxt").textContent="Couldn't load events";
    flash(manual?"✕ Couldn't refresh. Try again.":"✕ Couldn't load events","err");
  }finally{ if(manual){btn.disabled=false; btn.textContent="↻ Refresh";} }
}
document.getElementById("refresh").onclick=()=>refresh(true);
(function themeToggle(){
  const btn=document.getElementById("theme"), root=document.documentElement;
  const cur=()=>root.dataset.theme==="light"?"light":"dark";
  const label=()=>btn.textContent=cur()==="light"?"◐ Dark mode":"◐ Light mode";
  label();
  btn.onclick=()=>{const next=cur()==="light"?"dark":"light"; root.dataset.theme=next; try{localStorage.setItem("whatson-theme",next)}catch(_){}; label();};
})();
refresh(false);
function alignSidebar(){
  if(matchMedia("(max-width:820px)").matches){document.documentElement.style.removeProperty("--list-top");return;}
  const main=document.querySelector("main"), h=[...document.querySelectorAll("section:not(.hidden):not(.empty) h2")][0];
  if(!h) return;
  const btn=document.querySelector("aside button[data-f]");
  const offset=h.getBoundingClientRect().top-main.getBoundingClientRect().top;
  const pad=btn?parseFloat(getComputedStyle(btn).paddingTop):0;
  document.documentElement.style.setProperty("--list-top",Math.max(0,offset)+"px");
}
alignSidebar(); addEventListener("resize",alignSidebar); document.fonts&&document.fonts.ready.then(alignSidebar);
</script>
